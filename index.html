<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osu! Stream Guide</title>
  <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico?v=2">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="zx-background" aria-hidden="true">
    <div id="zx-field" class="zx-field"></div>
  </div>
  <main class="content">
    <img src="./images/logo.png" alt="Keyboard with only Z and X">
    <h1>osu! Stream Guide</h1>
    <p>Test</p>
  </main>
  <script>
    const field = document.getElementById("zx-field");
    const rowCount = 60;
    const repetitionsPerRow = 1000;
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < rowCount; i++) {
      const row = document.createElement("div");
      row.className = "zx-row";
      row.textContent = "zx".repeat(repetitionsPerRow);
      fragment.appendChild(row);
    }
    field.appendChild(fragment);
  </script>
</body>
</html>
